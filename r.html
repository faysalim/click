<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<meta name="robots" content="noindex">
</head>
<body>
<p id="msg">Redirecting…</p>
<noscript>
  <p>This link requires JavaScript. <a id="fallback" href="#">Click here to continue</a>.</p>
</noscript>

<script>
  var LOGGER_URL = "https://script.google.com/macros/s/AKfycbx8UuEyAglq3P7SiytVKYb6heoMucJ3d40MdzhFr-6DwzvX1rQf3l34jr0pYdrs1V8X/exec";

  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");

  function showError(text) {
    document.getElementById("msg").textContent = text;
  }

  function getIpWithTimeout(timeoutMs) {
    return Promise.race([
      fetch("https://api.ipify.org?format=json")
        .then(function (r) { return r.json(); })
        .then(function (j) { return j.ip || ""; })
        .catch(function () { return ""; }),
      new Promise(function (resolve) {
        setTimeout(function () { resolve(""); }, timeoutMs);
      })
    ]);
  }

  if (!id) {
    showError("Missing link id.");
  } else {
    fetch("links.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (links) {
        var link = links[id];
        if (!link) {
          showError("Link not found.");
          return;
        }

        getIpWithTimeout(700).then(function (ip) {
          try {
            var payload = JSON.stringify({
              id: id,
              contact: link.contact || "",
              channel: link.channel || "",
              url: link.url,
              ip: ip,
              referrer: document.referrer || "",
              ua: navigator.userAgent,
              t: new Date().toISOString()
            });
            fetch(LOGGER_URL, {
              method: "POST",
              mode: "no-cors",
              keepalive: true,
              body: payload
            }).catch(function () {});
          } catch (e) {}

          window.location.replace(link.url);
        });
      })
      .catch(function () {
        showError("Something went wrong.");
      });
  }
</script>
</body>
</html>
